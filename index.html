<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="台湾華語ワンタップ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>台湾華語 ワンタップ｜台湾の家族と話す</title>
<meta name="description" content="相槌はワンタップ、伝えたいことは単語を並べて台湾華語（繁體字）の文に。音声読み上げつき。">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  :root{
    --bg:#FFF7EF;
    --bg-deep:#FBEEDF;
    --card:#FFFFFF;
    --ink:#20252B;
    --ink-2:#5A6470;
    --ink-3:#9099A3;
    --teal:#127C78;
    --teal-deep:#0B5F5C;
    --teal-soft:#DCF0EE;
    --orange:#EF7A4A;
    --orange-deep:#C5532A;
    --orange-soft:#FCE7DC;
    --line:rgba(32,37,43,.10);
    --sh:0 4px 14px rgba(85,55,30,.07), 0 1px 2px rgba(85,55,30,.05);
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;scrollbar-width:none}
  ::-webkit-scrollbar{width:0;height:0;display:none}
  html{background:linear-gradient(180deg,var(--bg) 0%,var(--bg-deep) 100%);background-attachment:fixed;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
    color:var(--ink);min-height:100vh;line-height:1.5;-webkit-text-size-adjust:100%;
    font-feature-settings:"palt" 0;
  }
  body.locked{overflow:hidden}
  button{font-family:inherit;color:inherit}

  /* ---------- ヘッダー ---------- */
  .top{
    position:sticky;top:0;z-index:40;
    background:rgba(255,247,239,.96);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top,0px) + 7px) 12px 9px;
  }
  .brand{display:flex;align-items:center;gap:8px;margin:0 2px 7px}
  .brand .flag{font-size:1.05rem;line-height:1}
  .brand h1{font-size:.92rem;margin:0;font-weight:800;letter-spacing:.01em}
  .brand .sub{margin-left:auto;font-size:.66rem;color:var(--ink-3);font-weight:700;letter-spacing:.02em}

  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .tab{
    appearance:none;border:1px solid var(--line);background:#fff;
    border-radius:14px;min-height:44px;padding:6px 4px;cursor:pointer;
    font-size:.86rem;font-weight:800;color:var(--ink-2);
    display:flex;align-items:center;justify-content:center;gap:5px;
    transition:background .16s,color .16s,border-color .16s,box-shadow .16s,transform .1s;
  }
  .tab:active{transform:scale(.985)}
  .tab.on{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 5px 14px rgba(18,124,120,.24)}
  .tab .t-i{font-size:.95rem}

  /* ---------- 単語トレイ ---------- */
  #tray-dock{margin-top:8px}
  #tray-dock[hidden]{display:none}
  .tray-head{display:flex;align-items:center;gap:6px;margin:0 2px 4px}
  .tray-head .lbl{font-size:.68rem;font-weight:800;color:var(--ink-3);letter-spacing:.04em}
  .tray-head .count{font-size:.66rem;font-weight:800;color:var(--teal);margin-left:auto}
  .tray{
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    min-height:46px;max-height:92px;overflow-y:auto;
    padding:7px 8px;border-radius:14px;background:#fff;
    border:1.5px dashed rgba(18,124,120,.34);
  }
  .tray-empty{font-size:.76rem;color:var(--ink-3);font-weight:600;padding:2px 2px}
  .pill{
    appearance:none;border:1px solid rgba(18,124,120,.20);background:var(--teal-soft);
    color:var(--teal-deep);border-radius:999px;padding:5px 9px 5px 11px;
    font-size:.84rem;font-weight:800;display:inline-flex;align-items:center;gap:5px;
    line-height:1.25;cursor:pointer;
  }
  .pill .x{font-size:.82rem;opacity:.55;font-weight:700}
  .tray-actions{display:flex;gap:7px;margin-top:7px}
  .btn-clear{
    appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink-2);
    border-radius:13px;padding:0 14px;height:48px;font-size:.8rem;font-weight:800;cursor:pointer;
  }
  .btn-ok{
    flex:1;appearance:none;border:0;border-radius:14px;height:48px;cursor:pointer;
    background:linear-gradient(180deg,#F58A5B,var(--orange) 60%,var(--orange-deep));
    color:#fff;font-size:1rem;font-weight:900;letter-spacing:.04em;
    box-shadow:0 6px 16px rgba(196,84,42,.28);
    transition:transform .1s,box-shadow .16s,filter .16s;
  }
  .btn-ok:active{transform:translateY(1px) scale(.995)}
  .btn-ok:disabled{
    background:#E7E1DA;color:#B0A79E;box-shadow:none;cursor:default;
  }

  /* ---------- パネル ---------- */
  main{padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 26px)}
  .panel{display:none}
  .panel.on{display:block}

  .search{
    display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
    border-radius:14px;height:42px;padding:0 12px;margin-bottom:9px;box-shadow:var(--sh);
  }
  .search span{font-size:.95rem;opacity:.45}
  .search input{
    flex:1;border:0;outline:0;background:transparent;font-size:.92rem;min-width:0;
    height:100%;font-family:inherit;color:var(--ink);
  }
  .search input::placeholder{color:var(--ink-3)}

  .cats{
    display:flex;gap:7px;overflow-x:auto;padding:1px 1px 9px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .cats::-webkit-scrollbar{display:none}
  .cat{
    appearance:none;flex:0 0 auto;border:1px solid var(--line);background:#fff;
    border-radius:999px;padding:8px 13px;font-size:.8rem;font-weight:800;color:var(--ink-2);
    cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;
    transition:background .14s,color .14s,border-color .14s;
  }
  .cat .cat-i{font-size:.86rem}
  .cat .cat-s{font-size:.62rem;color:var(--ink-3);font-weight:700}
  .cat.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .cat.on .cat-s{color:rgba(255,255,255,.8)}
  .cat:active{transform:scale(.98)}

  /* ---------- ひとことカード ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .ph{
    appearance:none;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:10px 11px;min-height:70px;box-shadow:var(--sh);
    display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:pointer;
    transition:transform .1s,box-shadow .16s,border-color .16s;
  }
  .ph:active{transform:scale(.97);box-shadow:0 2px 8px rgba(85,55,30,.10)}
  .ph-ja{font-size:.72rem;color:var(--ink-2);font-weight:700;letter-spacing:.01em}
  .ph-zh{
    font-family:"Noto Sans TC","PingFang TC","Hiragino Sans","Yu Gothic",sans-serif;
    font-size:1.06rem;font-weight:900;color:var(--teal-deep);line-height:1.32;
    letter-spacing:.01em;word-break:break-word;
  }

  /* ---------- 単語チップ ---------- */
  .grid.words{grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}
  .chip{
    appearance:none;background:var(--card);border:1px solid var(--line);border-radius:14px;
    min-height:58px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1px;box-shadow:var(--sh);cursor:pointer;
    transition:transform .1s,box-shadow .16s;
  }
  .chip:active{transform:scale(.95)}
  .c-ja{font-size:.7rem;color:var(--ink-2);font-weight:700;line-height:1.2}
  .c-zh{
    font-family:"Noto Sans TC","PingFang TC","Hiragino Sans",sans-serif;
    font-size:.95rem;font-weight:900;color:var(--teal-deep);line-height:1.25;
  }
  .empty{
    grid-column:1/-1;text-align:center;color:var(--ink-3);font-size:.8rem;
    padding:22px 10px;font-weight:600;
  }

  /* ---------- マイ単語 ---------- */
  .mine-add{
    grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:10px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:7px;
  }
  .mine-row{display:flex;gap:7px}
  .mine-row input,.mine-row select{
    flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:11px;
    padding:0 10px;font-size:.86rem;font-family:inherit;background:#FCFAF7;color:var(--ink);
  }
  .mine-btn{
    flex:0 0 auto;appearance:none;border:0;border-radius:11px;padding:0 14px;height:42px;
    background:var(--teal);color:#fff;font-weight:800;font-size:.86rem;cursor:pointer;
  }
  .mine-note{margin:0;font-size:.66rem;color:var(--ink-3);font-weight:600}
  .mine-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}

  /* ---------- 全画面カード ---------- */
  .modal{
    position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#FFFDF9 0%,#FFF6EC 100%);
    opacity:0;transition:opacity .18s ease;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);
  }
  .modal[hidden]{display:none}
  .modal.on{opacity:1}
  .card-top{display:flex;align-items:center;gap:8px}
  .card-tag{
    font-size:.66rem;font-weight:900;letter-spacing:.14em;color:var(--teal);
    background:var(--teal-soft);border-radius:999px;padding:5px 11px;
  }
  .card-close{
    margin-left:auto;appearance:none;border:1px solid var(--line);background:#fff;
    width:42px;height:42px;border-radius:50%;font-size:1.15rem;line-height:1;color:var(--ink-2);
    cursor:pointer;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;
  }
  .card-body{
    flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;gap:12px;padding:6px 0 4px;overflow-y:auto;
  }
  .card-ja{font-size:1rem;font-weight:800;color:var(--ink-2);letter-spacing:.01em}
  .card-zh{
    font-family:"Noto Sans TC","PingFang TC","Hiragino Sans","Yu Gothic",sans-serif;
    font-weight:900;color:#152220;line-height:1.34;letter-spacing:.015em;
    word-break:break-word;font-size:clamp(2rem,15vw,6rem);
  }
  .card-kana{
    font-size:1rem;font-weight:800;color:var(--orange-deep);letter-spacing:.03em;
    line-height:1.5;
  }
  .card-py{font-size:.82rem;color:var(--ink-3);letter-spacing:.02em;font-weight:600}
  .card-note{
    font-size:.7rem;color:var(--orange-deep);background:var(--orange-soft);
    border-radius:999px;padding:5px 12px;font-weight:700;display:none;
  }
  .card-foot{display:flex;gap:9px;align-items:center;justify-content:center;padding-top:6px}
  .btn-speak{
    appearance:none;border:0;border-radius:999px;height:56px;padding:0 26px;
    background:linear-gradient(180deg,#1A8E89,var(--teal) 60%,var(--teal-deep));
    color:#fff;font-size:1rem;font-weight:900;letter-spacing:.03em;cursor:pointer;
    box-shadow:0 8px 20px rgba(18,124,120,.26);display:inline-flex;align-items:center;gap:8px;
  }
  .btn-speak:active{transform:translateY(1px) scale(.99)}
  .card-hint{
    text-align:center;font-size:.64rem;color:var(--ink-3);margin:8px 0 0;font-weight:600;
  }

  /* ---------- トースト ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    transform:translate(-50%,14px);z-index:200;
    background:rgba(32,37,43,.94);color:#fff;font-size:.8rem;font-weight:700;
    padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .18s,transform .18s;max-width:88vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (min-width:520px){
    main{max-width:560px;margin:0 auto}
    .top{padding-left:16px;padding-right:16px}
    .top > *{max-width:560px;margin-left:auto;margin-right:auto}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="flag">🇹🇼</span>
    <h1>台湾華語 ワンタップ</h1>
    <span class="sub">家族と その場で</span>
  </div>
  <nav class="tabs">
    <button class="tab on" data-tab="say"><span class="t-i">💬</span>ひとこと</button>
    <button class="tab" data-tab="build"><span class="t-i">🧩</span>ことばで文</button>
  </nav>

  <div id="tray-dock" hidden>
    <div class="tray-head">
      <span class="lbl">えらんだ ことば</span>
      <span class="count" id="tray-count"></span>
    </div>
    <div class="tray" id="tray"></div>
    <div class="tray-actions">
      <button class="btn-clear" id="clear">クリア</button>
      <button class="btn-ok" id="ok" disabled>OK！ 文にする</button>
    </div>
  </div>
</header>

<main>
  <!-- ① ひとこと -->
  <section class="panel on" id="tab-say">
    <div class="search">
      <span>🔍</span>
      <input id="say-search" type="search" placeholder="日本語・中文・ピンインで探す" autocomplete="off">
    </div>
    <div class="cats" id="say-cats"></div>
    <div class="grid" id="say-grid"></div>
    <p class="card-hint">タップすると大きな文字で出ます・🔊で発音</p>
  </section>

  <!-- ② ことばで文 -->
  <section class="panel" id="tab-build">
    <div class="search">
      <span>🔍</span>
      <input id="word-search" type="search" placeholder="ことばを探す（例：トイレ）" autocomplete="off">
    </div>
    <div class="cats" id="word-cats"></div>
    <div class="grid words" id="word-grid"></div>
    <p class="card-hint">ことばを順番にタップ → 「OK！」で台湾華語の文に</p>
  </section>
</main>

<!-- 全画面カード -->
<div class="modal" id="modal" hidden>
  <div class="card-top">
    <span class="card-tag">台灣華語</span>
    <button class="card-close" aria-label="閉じる">×</button>
  </div>
  <div class="card-body">
    <div class="card-ja" id="card-ja"></div>
    <div class="card-zh" id="card-zh"></div>
    <div class="card-kana" id="card-kana"></div>
    <div class="card-py" id="card-py"></div>
    <div class="card-note" id="card-note"></div>
  </div>
  <div class="card-foot">
    <button class="btn-speak" id="speak">🔊 発音を聞く</button>
  </div>
  <p class="card-hint">画面を相手に見せながら話せます</p>
</div>

<div class="toast" id="toast"></div>

<script>

  {c:'greet', ja:'おはよう',            zh:'早安',          py:'zǎo ān',                 k:'ザオ アン'},

  {c:'func', ja:'？',         zh:'嗎',     py:'ma',            k:'マ',            r:'q'},

  {c:'func', ja:'ください',   zh:'請給我', py:'qǐng gěi wǒ',   k:'チン ゲイ ウオ', r:'please'},
  {c:'func', ja:'少し',       zh:'一點',   py:'yìdiǎn',        k:'イーディエン',  r:'degree'},
  {c:'func', ja:'とても',     zh:'很',     py:'hěn',           k:'ヘン',          r:'degree'},
  {c:'func', ja:'一緒に',     zh:'一起',   py:'yìqǐ',          k:'イーチー',      r:'together'},
  {c:'func', ja:'〜しましょう', zh:'吧',   py:'ba',            k:'バ',            r:'sugg'},
  {c:'func', ja:'〜しない',   zh:'不要',   py:'búyào',         k:'プーヤオ',      r:'neg'},

  {c:'func', ja:'どこ',       zh:'哪裡',   py:'nǎlǐ',          k:'ナーリー',      r:'wh', key:'where'},
  {c:'func', ja:'なに',       zh:'什麼',   py:'shénme',        k:'シェンマ',      r:'wh', key:'what'},
  {c:'func', ja:'いくら',     zh:'多少錢', py:'duōshao qián',  k:'ドゥオシャオ チェン', r:'wh', key:'howmuch'},
  {c:'func', ja:'だれ',       zh:'誰',     py:'shéi',          k:'シェイ',        r:'wh', key:'who'},
  {c:'func', ja:'いつ',       zh:'什麼時候', py:'shénme shíhou', k:'シェンマ シーホウ', r:'wh', key:'when'},
  {c:'func', ja:'〜と（and）', zh:'和',     py:'hé',            k:'ハー',          r:'conj'},
  {c:'func', ja:'でも',       zh:'但是',   py:'dànshì',        k:'ダンシー',      r:'conj'},
  {c:'func', ja:'〜がほしい', zh:'要',     py:'yào',           k:'ヤオ',          r:'want'}
];

</script>
<script>
/* ============================================================
   台湾華語ワンタップ ─ 文づくりエンジン & UI
   ============================================================ */

/* ---------- 文づくりで使う部品（繁体字・ピンイン・カタカナ） ---------- */
const T = (zh, py, k) => ({ zh, py, k });
const CH = {
  wo:    T('我', 'wǒ', 'ウオ'),
  women: T('我們', 'wǒmen', 'ウオメン'),
  ni:    T('你', 'nǐ', 'ニー'),
  keyi:  T('可以', 'kěyǐ', 'クーイー'),
  yao:   T('要', 'yào', 'ヤオ'),
  xiang: T('想', 'xiǎng', 'シャン'),
  bu:    T('不', 'bú', 'プー'),
  hen:   T('很', 'hěn', 'ヘン'),
  youdian: T('有點', 'yǒudiǎn', 'ヨウディエン'),
  yixia: T('一下', 'yíxià', 'イーシャー'),
  yiqi:  T('一起', 'yìqǐ', 'イーチー'),
  ba:    T('吧', 'ba', 'バ'),
  ma:    T('嗎', 'ma', 'マ'),
  zai:   T('在', 'zài', 'ザイ'),
  hui:   T('會', 'huì', 'ホイ'),
  qing:  T('請', 'qǐng', 'チン'),
  gei:   T('給', 'gěi', 'ゲイ'),
  nali:  T('哪裡', 'nǎlǐ', 'ナーリー'),
  shenme:T('什麼', 'shénme', 'シェンマ'),
  duoshao: T('多少錢', 'duōshao qián', 'ドゥオシャオ チェン'),
  zheshi: T('這是', 'zhè shì', 'ジャー シー')
};

/* ---------- 動詞の日本語形（意味表示用） ---------- */
const VF = {
  go:    { base: '行く',       te: '行って',       tai: '行きたい',       vol: '行こう' },
  come:  { base: '来る',       te: '来て',         tai: '来たい',         vol: '来よう' },
  eat:   { base: '食べる',     te: '食べて',       tai: '食べたい',       vol: '食べよう' },
  drink: { base: '飲む',       te: '飲んで',       tai: '飲みたい',       vol: '飲もう' },
  see:   { base: '見る',       te: '見て',         tai: '見たい',         vol: '見よう' },
  buy:   { base: '買う',       te: '買って',       tai: '買いたい',       vol: '買おう' },
  rest:  { base: '休む',       te: '休んで',       tai: '休みたい',       vol: '休もう' },
  sleep: { base: '寝る',       te: '寝て',         tai: '寝たい',         vol: '寝よう' },
  photo: { base: '写真を撮る', te: '写真を撮って', tai: '写真を撮りたい', vol: '写真を撮ろう' },
  walk:  { base: '歩く',       te: '歩いて',       tai: '歩きたい',       vol: '歩こう' },
  wait:  { base: '待つ',       te: '待って',       tai: '待ちたい',       vol: '待とう' },
  back:  { base: '帰る',       te: '帰って',       tai: '帰りたい',       vol: '帰ろう' },
  ride:  { base: '乗る',       te: '乗って',       tai: '乗りたい',       vol: '乗ろう' },
  meet:  { base: '会う',       te: '会って',       tai: '会いたい',       vol: '会おう' },
  pay:   { base: '払う',       te: '払って',       tai: '払いたい',       vol: '払おう' },
  tire:  { base: '疲れる',     te: '疲れて',       tai: '疲れたい',       vol: '疲れよう' }
};

/* ---------- 文を組み立てる ---------- */
function compose(sel) {
  const g = {
    time: null, subj: null, place: null, obj: null, noun: null, verb: null, adj: null,
    q: false, want: false, can: false, please: false, deg: null,
    together: false, again: false, neg: false, sugg: false, wh: null
  };
  for (const w of sel) {
    switch (w.r) {
      case 'time':     g.time = g.time || w; break;
      case 'subj':     g.subj = g.subj || w; break;
      case 'place':    g.place = g.place || w; break;
      case 'obj':      g.obj = g.obj || w; break;
      case 'noun':     g.noun = g.noun || w; break;
      case 'verb':     g.verb = g.verb || w; break;
      case 'adj':      g.adj = g.adj || w; break;
      case 'q':        g.q = true; break;
      case 'want':     g.want = true; break;
      case 'can':      g.can = true; break;
      case 'please':   g.please = true; break;
      case 'degree':   g.deg = g.deg || w; break;
      case 'together': g.together = true; break;
      case 'again':    g.again = true; break;
      case 'neg':      g.neg = true; break;
      case 'sugg':     g.sugg = true; break;
      case 'wh':       g.wh = g.wh || w; break;
    }
  }

  const S = [];
  const put = (t) => { if (t) S.push(t); };
  const finish = (end, ja, note) => {
    const mark = end === '？' ? '?' : end === '！' ? '!' : '.';
    const zh = S.map(x => x.zh).join('') + end;
    const py = S.map(x => x.py).join(' ').replace(/\s+/g, ' ').trim() + mark;
    const kana = S.map(x => x.k).join(' ');
    return { zh, py, kana, ja, note: note || '' };
  };

  const TOPIC = g.noun || g.place || g.obj;      /* 形容詞の対象になる名詞 */
  const THING = g.obj || g.noun;                 /* 動詞の目的語 */
  const SUBJ = g.subj;

  /* ---- きく（疑問詞） ---- */
  if (g.wh) {
    if (g.wh.key === 'where') {
      if (g.place || g.noun) {
        put(g.place || g.noun); put(CH.zai); put(CH.nali);
        return finish('？', `${(g.place || g.noun).ja}はどこ？`);
      }
      put(CH.zai); put(CH.nali);
      return finish('？', 'どこ？');
    }
    if (g.wh.key === 'howmuch') {
      if (THING) put(THING);
      put(CH.duoshao);
      return finish('？', `${THING ? THING.ja + 'は' : ''}いくら？`);
    }
    if (g.wh.key === 'what') {
      put(CH.zheshi); put(CH.shenme);
      return finish('？', 'これは何？');
    }
    if (g.wh.key === 'who') {
      put(CH.zheshi); put(T('誰', 'shéi', 'シェイ'));
      return finish('？', 'これは誰？');
    }
    if (g.wh.key === 'when') {
      if (g.verb) {
        put(T('什麼時候', 'shénme shíhou', 'シェンマ シーホウ')); put(g.verb);
        return finish('？', `いつ${g.verb.ja}？`);
      }
      put(T('什麼時候', 'shénme shíhou', 'シェンマ シーホウ'));
      return finish('？', 'いつ？');
    }
  }

  /* ---- ください ---- */
  if (g.please) {
    const want = THING || g.place;
    put(CH.qing); put(CH.gei); put(CH.wo);
    if (want) put(want);
    return finish('。', `${(want || { ja: 'これ' }).ja}をください`);
  }

  /* ---- 動詞がある ---- */
  if (g.verb) {
    const v = g.verb;
    const F = VF[v.key] || { base: v.ja, te: v.ja, tai: v.ja, vol: v.ja };
    const VP = [];
    let jaPre = '';

    if (v.key === 'go') {
      const dest = g.place || g.obj || g.noun;
      VP.push(v);
      if (dest) {
        VP.push(dest);
        if (dest.tail) VP.push(T(dest.tail.zh, dest.tail.py, dest.tail.k));
        jaPre = `${dest.ja}に`;
      }
    } else if (v.key === 'rest' || v.key === 'sleep' || v.key === 'wait') {
      if (g.place) { VP.push(CH.zai); VP.push(g.place); jaPre = `${g.place.ja}で`; }
      VP.push(v); VP.push(CH.yixia);
    } else if (v.key === 'photo') {
      if (g.place) { VP.push(CH.zai); VP.push(g.place); jaPre = `${g.place.ja}で`; }
      VP.push(v);
    } else if (v.key === 'walk' || v.key === 'back' || v.key === 'meet' ||
               v.key === 'pay' || v.key === 'come' || v.key === 'tire') {
      VP.push(v);
    } else {
      /* eat / drink / buy / see / ride など：目的語をとる */
      const target = g.obj || g.noun || g.place;
      VP.push(v);
      if (target) { VP.push(target); jaPre = `${target.ja}を`; }
    }

    /* 疑問文 */
    if (g.q) {
      if (SUBJ && SUBJ.zh === '你') {
        put(SUBJ); put(CH.yao); VP.forEach(x => put(x)); put(CH.ma);
        return finish('？', `${jaPre}${F.base}？`);
      }
      put(CH.wo); put(CH.keyi); VP.forEach(x => put(x)); put(CH.ma);
      return finish('？', `${jaPre}${F.te}もいい？`);
    }
    /* 〜したい */
    if (g.want) {
      put(SUBJ || CH.wo); put(CH.xiang); VP.forEach(x => put(x));
      return finish('。', `${jaPre}${F.tai}`);
    }
    /* 一緒に〜しよう（写真は特に） */
    if (g.together || (v.key === 'photo' && !SUBJ)) {
      put(CH.women);
      if (g.time) put(g.time);
      put(CH.yiqi); VP.forEach(x => put(x)); put(CH.ba);
      return finish('！', `一緒に${jaPre}${F.vol}`);
    }
    /* 〜しない */
    if (g.neg) {
      put(SUBJ || CH.wo); put(CH.bu); VP.forEach(x => put(x));
      return finish('。', `${jaPre}${F.tai.replace(/たい$/, 'たくない')}`);
    }
    /* 〜できる */
    if (g.can) {
      put(SUBJ || CH.wo); put(CH.keyi); VP.forEach(x => put(x));
      return finish('。', `${jaPre}${F.base}ことができる`);
    }
    /* 〜しましょう */
    if (g.sugg) {
      put(SUBJ || CH.women);
      if (g.time) put(g.time);
      VP.forEach(x => put(x)); put(CH.ba);
      return finish('。', `${jaPre}${F.vol}`);
    }
    /* ふつうの文 */
    put(SUBJ || CH.wo);
    if (g.time) put(g.time);
    VP.forEach(x => put(x));
    return finish(g.again ? '！' : '。', `${jaPre}${F.base}`);
  }

  /* ---- 形容詞がある ---- */
  if (g.adj) {
    const a = g.adj;
    const aJa = a.ja2 || a.ja;
    if (g.q) {
      if (SUBJ) { put(SUBJ); put(CH.hui); put(a); put(CH.ma); return finish('？', `${SUBJ.ja}は${aJa}？`); }
      if (TOPIC) { put(TOPIC); put(CH.hui); put(a); put(CH.ma); return finish('？', `${TOPIC.ja}は${aJa}？`); }
      put(a); put(CH.ma);
      return finish('？', `${aJa}？`);
    }
    const degSeg = (g.deg && g.deg.zh === '一點') ? CH.youdian : CH.hen;
    if (TOPIC) {
      if (g.time) put(g.time);
      put(TOPIC); put(degSeg); put(a);
      return finish('！', `${g.time ? g.time.ja + 'の' : ''}${TOPIC.ja}は${aJa}`);
    }
    if (g.time) put(g.time);
    if (SUBJ) put(SUBJ);
    put(degSeg); put(a);
    return finish('！', `${SUBJ ? SUBJ.ja + 'は' : ''}${aJa}`);
  }

  /* ---- 名詞だけ：〜はどう？ ---- */
  if (g.q && TOPIC) {
    if (g.time) put(g.time);
    put(TOPIC); put(T('怎麼樣', 'zěnmeyàng', 'ゼンマヤン'));
    return finish('？', `${TOPIC.ja}はどう？`);
  }

  /* ---- 名詞だけ ---- */
  const list = sel.filter(w => w.r !== 'q');
  if (!list.length) return null;
  list.forEach(w => put(w));
  return finish(g.q ? '？' : '。', list.map(w => w.ja).join('・'),
    'ことばを足すと、もっと自然な文になるよ');
}

/* ============================================================
   状態
   ============================================================ */
const STORE = 'taiwanTalk.v1';
const state = {
  tab: 'say',
  sayCat: 'aizuchi',
  wordCat: 'time',
  tray: [],
  query: '',
  mine: []
};

try {
  const saved = JSON.parse(localStorage.getItem(STORE) || '{}');
  if (Array.isArray(saved.mine)) state.mine = saved.mine;
} catch (e) { /* ignore */ }

function saveMine() {
  try { localStorage.setItem(STORE, JSON.stringify({ mine: state.mine })); } catch (e) {}
}

/* ============================================================
   読み上げ
   ============================================================ */
let voiceCache = [];
function loadVoices() {
  try {
    if (!('speechSynthesis' in window)) return;
    voiceCache = window.speechSynthesis.getVoices() || [];
  } catch (e) { voiceCache = []; }
}
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.addEventListener('voiceschanged', loadVoices);
}

function speak(text) {
  try {
    if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
      toast('この端末は読み上げに未対応です。文字で見せてね');
      return;
    }
    if (!voiceCache.length) loadVoices();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-TW';
    u.rate = 0.88;
    u.pitch = 1;
    const vs = voiceCache;
    const v = vs.find(x => /zh[-_]?(TW|Hant)/i.test(x.lang)) ||
              vs.find(x => /^zh/i.test(x.lang)) ||
              vs.find(x => /Chinese|中文|國語|台湾/i.test(x.name || ''));
    if (v) u.voice = v;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) {
    toast('読み上げができませんでした。文字で見せてね');
  }
}

/* ============================================================
   小さなユーティリティ
   ============================================================ */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}

/* ============================================================

function renderSayCats() {
  $('#say-cats').innerHTML = PHRASE_CATS.map(c => `
    <button class="cat ${state.sayCat === c.id ? 'on' : ''}" data-say-cat="${c.id}">
      <span class="cat-i">${c.icon}</span>${esc(c.label)}
    </button>`).join('');
}

function renderSayGrid() {
  const q = state.query.trim().toLowerCase();
  const items = PHRASES.filter(p => {
    if (q) return (p.ja + p.zh + p.py + p.k).toLowerCase().includes(q);
    return p.c === state.sayCat;
  });
  const grid = $('#say-grid');
  if (!items.length) {
    grid.innerHTML = '<p class="empty">見つからなかったよ。ことばを変えてみてね</p>';
    return;
  }
  grid.innerHTML = items.map(p => {
    const i = PHRASES.indexOf(p);
    return `<button class="ph" data-ph="${i}">
      <span class="ph-ja">${esc(p.ja)}</span>
      <span class="ph-zh">${esc(p.zh)}</span>
    </button>`;
  }).join('');
}

/* ============================================================
   ことばビルダー
   ============================================================ */
function allWords() {
  return WORDS.concat(state.mine);
}

function renderWordCats() {
  const cats = WORD_CATS.map(c => `
    <button class="cat ${state.wordCat === c.id ? 'on' : ''}" data-word-cat="${c.id}">
      ${esc(c.label)}<span class="cat-s">${esc(c.sub)}</span>
    </button>`).join('');
  $('#word-cats').innerHTML = cats;
}

function renderWordGrid() {
  const q = state.query.trim().toLowerCase();
  const pool = allWords();
  const items = pool.filter(w => {
    if (q) return (w.ja + w.zh + w.py + w.k).toLowerCase().includes(q);
    return w.c === state.wordCat;
  });
  const grid = $('#word-grid');

  if (state.wordCat === 'mine' && !q) {
    /* マイ単語：追加フォーム＋一覧 */
    const mineList = state.mine.map(w => {
      const idx = state.mine.indexOf(w);
      return `<button class="chip" data-mine="${idx}">
        <span class="c-ja">${esc(w.ja)}</span>
        <span class="c-zh">${esc(w.zh)}</span>
      </button>`;
    }).join('');
    grid.innerHTML = `
      <div class="mine-add">
        <div class="mine-row">
          <input id="mine-ja" type="text" inputmode="text" placeholder="日本語（例：桜）" autocomplete="off">
          <input id="mine-zh" type="text" inputmode="text" placeholder="台湾華語（例：櫻花）" autocomplete="off">
        </div>
        <div class="mine-row">
          <select id="mine-role" aria-label="種類">
            <option value="noun">もの・ことば</option>
            <option value="place">場所</option>
            <option value="obj">たべもの</option>
            <option value="verb">どうさ</option>
            <option value="adj">ようす</option>
            <option value="time">いつ</option>
            <option value="subj">ひと</option>
          </select>
          <button class="mine-btn" id="mine-add">＋ 追加</button>
        </div>
        <p class="mine-note">追加した単語はこの端末に保存されます。</p>
      </div>
      ${mineList ? `<div class="mine-grid">${mineList}</div>` : '<p class="empty">まだマイ単語はありません</p>'}
    `;
    return;
  }

  if (!items.length) {
    grid.innerHTML = '<p class="empty">見つからなかったよ。ことばを変えてみてね</p>';
    return;
  }
  grid.innerHTML = items.map(w => {
    const i = pool.indexOf(w);
    return `<button class="chip" data-word="${i}">
      <span class="c-ja">${esc(w.ja)}</span>
      <span class="c-zh">${esc(w.zh)}</span>
    </button>`;
  }).join('');
}

function renderTray() {
  const tray = $('#tray');
  if (!state.tray.length) {
    tray.innerHTML = '<span class="tray-empty">ことばをタップして並べてね</span>';
  } else {
    tray.innerHTML = state.tray.map((w, i) => `
      <button class="pill" data-tray="${i}">${esc(w.ja)}<span class="x">×</span></button>
    `).join('');
  }
  const ok = $('#ok');
  ok.disabled = state.tray.length === 0;
  ok.classList.toggle('ready', state.tray.length > 0);
  $('#tray-count').textContent = state.tray.length ? `${state.tray.length}語` : '';
}

/* ============================================================
   全画面カード
   ============================================================ */
let modalData = null;

function openCard(data) {
  modalData = data;
  $('#card-ja').textContent = data.ja || '';
  $('#card-note').textContent = data.note || '';
  $('#card-note').style.display = data.note ? 'block' : 'none';
  $('#card-zh').textContent = data.zh;
  $('#card-kana').textContent = data.kana || data.k || '';
  $('#card-py').textContent = data.py || '';
  $('#modal').hidden = false;
  requestAnimationFrame(() => $('#modal').classList.add('on'));
  document.body.classList.add('locked');
  fitZh();
}

function closeCard() {
  const m = $('#modal');
  m.classList.remove('on');
  document.body.classList.remove('locked');
  setTimeout(() => { m.hidden = true; }, 180);
}

function fitZh() {
  const el = $('#card-zh');
  if (!el) return;
  const len = (el.textContent || '').length;
  let size = 15;                       /* vw換算の出発点 */
  if (len > 8) size = 11.5;
  if (len > 12) size = 9.5;
  if (len > 18) size = 7.6;
  if (len > 26) size = 6.2;
  el.style.fontSize = `clamp(2rem, ${size}vw, 6rem)`;
}

/* ============================================================
   イベント
   ============================================================ */
function setTab(tab) {
  state.tab = tab;
  state.query = '';
  const s1 = $('#say-search'), s2 = $('#word-search');
  if (s1) s1.value = '';
  if (s2) s2.value = '';
  $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $$('.panel').forEach(p => p.classList.toggle('on', p.id === `tab-${tab}`));
  $('#tray-dock').hidden = tab !== 'build';
  if (tab === 'say') { renderSayCats(); renderSayGrid(); }
  else { renderWordCats(); renderWordGrid(); renderTray(); }
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function bind() {
  $$('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

  /* ひとこと */
  $('#say-cats').addEventListener('click', (e) => {
    const b = e.target.closest('[data-say-cat]');
    if (!b) return;
    state.sayCat = b.dataset.sayCat;
    renderSayCats(); renderSayGrid();
  });
  $('#say-grid').addEventListener('click', (e) => {
    const b = e.target.closest('[data-ph]');
    if (!b) return;
    const p = PHRASES[Number(b.dataset.ph)];
    openCard(p);
    speak(p.zh);
  });
  $('#say-search').addEventListener('input', (e) => {
    state.query = e.target.value;
    renderSayGrid();
  });

  /* ことば */
  $('#word-cats').addEventListener('click', (e) => {
    const b = e.target.closest('[data-word-cat]');
    if (!b) return;
    state.wordCat = b.dataset.wordCat;
    state.query = '';
    $('#word-search').value = '';
    renderWordCats(); renderWordGrid();
  });
  $('#word-grid').addEventListener('click', (e) => {
    const addBtn = e.target.closest('#mine-add');
    if (addBtn) { addMine(); return; }
    const chip = e.target.closest('[data-word], [data-mine]');
    if (!chip) return;
    if (chip.dataset.mine !== undefined) {
      const w = state.mine[Number(chip.dataset.mine)];
      if (w) { state.tray.push(w); renderTray(); }
      return;
    }
    const w = allWords()[Number(chip.dataset.word)];
    if (w) { state.tray.push(w); renderTray(); }
  });
  $('#word-search').addEventListener('input', (e) => {
    state.query = e.target.value;
    renderWordGrid();
  });
  $('#tray').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tray]');
    if (!b) return;
    state.tray.splice(Number(b.dataset.tray), 1);
    renderTray();
  });
  $('#clear').addEventListener('click', () => { state.tray = []; renderTray(); });
  $('#ok').addEventListener('click', () => {
    const res = compose(state.tray);
    if (!res) return;
    openCard(res);
    speak(res.zh);
  });

  /* カード */
  $('#modal').addEventListener('click', (e) => {
    if (e.target.closest('.card-close') || e.target.id === 'modal') closeCard();
  });
  $('#speak').addEventListener('click', () => { if (modalData) speak(modalData.zh); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeCard();
  });
  window.addEventListener('resize', fitZh);
}

function addMine() {
  const ja = ($('#mine-ja').value || '').trim();
  const zh = ($('#mine-zh').value || '').trim();
  const role = $('#mine-role').value;
  if (!ja || !zh) { toast('日本語と台湾華語の両方を入れてね'); return; }
  state.mine.push({ c: 'mine', ja, zh, py: '', k: '', r: role, key: 'custom' });
  saveMine();
  renderWordGrid();
  renderTray();
  toast(`「${ja}」を追加したよ`);
}

/* ============================================================
   起動
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  bind();
  renderSayCats();
  renderSayGrid();
  renderWordCats();
  renderWordGrid();
  renderTray();
  $('#phrase-count').textContent = PHRASES.length;
  $('#word-count').textContent = WORDS.length;
});

</script>
</body>
</html>
